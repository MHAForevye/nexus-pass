<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)">
<meta name="description" content="Forevye Nexus Pass: üyelikler, kristal abonelikleri ve bağlı uygulamalar tek yerde.">
<title>Nexus Pass</title>
<link rel="icon" href="assets/crystal.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('np.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-chevL" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
  <symbol id="i-chevR" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M10 5H6.5A1.5 1.5 0 0 0 5 6.5v11A1.5 1.5 0 0 0 6.5 19h11a1.5 1.5 0 0 0 1.5-1.5V14"/><path d="M14 5h5v5M19 5l-8 8"/></symbol>
  <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/></symbol>

  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V10M9.5 3.5h5"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.2-2h5.6L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.5"/></symbol>

  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.8"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M6 18l1.4-1.4M16.6 7.4 18 6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.6 7.6 0 0 1 9.4 4.5a7.6 7.6 0 1 0 10.1 10.1z"/></symbol>

  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 5H6.5A1.5 1.5 0 0 0 5 6.5v11A1.5 1.5 0 0 0 6.5 19H10M14 8l4 4-4 4M18 12H9"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8v.01"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 3.5 19h17z"/><path d="M12 10v4M12 16.8v.01"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3A4 4 0 0 0 13 5.3l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></symbol>

<div id="offline" class="banner" hidden role="status"><svg class="ic"><use href="#i-alert"/></svg> Bağlantı kesildi. Son bilinen veriler gösteriliyor.</div>

<div class="app-frame">
  <header class="top">
    <a class="brand" href="#home" aria-label="Nexus Pass ana sayfa">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.8 27.4 9.4v13.2L16 29.2 4.6 22.6V9.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M16 9.6 21.6 16 16 22.4 10.4 16z" fill="currentColor"/></svg>
      <span class="brand-copy"><b>Nexus Pass</b><small>Forevye</small></span>
    </a>
    <div class="top-right">
      <div class="connection-pills" aria-label="Bağlantı durumu">
        <span class="connection-pill"><i id="nexus-dot" class="is-off"></i><span id="nexus-state">Nexus: giriş bekleniyor</span></span>
        <span class="connection-pill"><i id="crystal-dot" class="is-off"></i><span id="crystal-state">Kristal: bağlanıyor</span></span>
      </div>
      <div class="bals">
        <a class="bal crystal-bal" id="kbal" href="#acct" aria-label="Kristal bakiyesi"></a>
        <div class="bal fn-bal" id="bal" aria-label="FN bakiyesi"></div>
      </div>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Görünüm: sistem"><svg class="ic"><use href="#i-monitor"/></svg></button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" aria-label="Ana menü">
      <nav>
        <div class="side-label">Çalışma alanı</div>
        <a href="#home" data-r="home" class="side-link"><svg class="ic"><use href="#i-home"/></svg><span>Genel bakış</span></a>
        <a href="#mine" data-r="mine" class="side-link"><svg class="ic"><use href="#i-clock"/></svg><span>Üyeliklerim</span></a>
        <a href="#discover" data-r="discover" class="side-link"><svg class="ic"><use href="#i-compass"/></svg><span>Keşfet</span></a>
        <a href="#history" data-r="history" class="side-link"><svg class="ic"><use href="#i-list"/></svg><span>Hareketler</span></a>
        <div class="side-label">Ekosistem</div>
        <a href="#systems" data-r="systems" class="side-link"><svg class="ic"><use href="#i-grid"/></svg><span>Bağlı sistemler</span></a>
        <a href="#acct" data-r="acct" class="side-link"><img class="ic-img" src="assets/crystal.svg" alt=""><span>Kristal hesabı</span></a>
      </nav>
      <div class="side-foot">Forevye Nexus · Pass</div>
    </aside>

    <section class="content-area">
      <main id="app" aria-live="polite"></main>
    </section>
  </div>
</div>

<!-- Ambient desk lamp: the shade pivots from the arm's fixed end joint; the warm light is always on. -->
<aside class="desk-lamp" id="deskLamp" aria-label="Ayarlanabilir masa lambası">
  <div class="lamp-caption"><span class="lamp-live"><i></i> Ortam ışığı</span><span><b id="lampAngleValue">−18°</b></span></div>
  <svg id="lampSvg" class="lamp-svg" viewBox="0 0 320 430" role="img" aria-labelledby="lampTitle lampDesc">
    <title id="lampTitle">Ayarlanabilir masa lambası</title>
    <desc id="lampDesc">Başlık, bağlı olduğu mafsaldan tutularak çevrilebilir. Klavyede sağ ve sol ok tuşları da kullanılabilir.</desc>
    <defs>
      <linearGradient id="lampMetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9e4da"/><stop offset=".25" stop-color="#8d8a84"/><stop offset=".5" stop-color="#d7d2c8"/><stop offset=".75" stop-color="#5d5b57"/><stop offset="1" stop-color="#cfcabf"/></linearGradient>
      <linearGradient id="lampShade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9d6cf"/><stop offset=".4" stop-color="#6e6d69"/><stop offset=".75" stop-color="#2d3032"/><stop offset="1" stop-color="#18191b"/></linearGradient>
      <linearGradient id="lampBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd875" stop-opacity=".3"/><stop offset=".52" stop-color="#ffc94e" stop-opacity=".1"/><stop offset="1" stop-color="#ffc94e" stop-opacity="0"/></linearGradient>
      <radialGradient id="lampBulb"><stop offset="0" stop-color="#fff8cf"/><stop offset=".3" stop-color="#ffe6a0" stop-opacity=".95"/><stop offset="1" stop-color="#ffca58" stop-opacity="0"/></radialGradient>
      <filter id="lampGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="11"/></filter>
      <filter id="lampShadow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>
    <g id="lampLight" transform="rotate(-18 145 190)" pointer-events="none">
      <path d="M103 166 L187 166 L300 425 L-10 425 Z" fill="url(#lampBeam)"/>
      <ellipse cx="145" cy="240" rx="112" ry="75" fill="#ffc95a" opacity=".045" filter="url(#lampGlow)"/>
    </g>
    <ellipse cx="215" cy="409" rx="82" ry="10" fill="#000" opacity=".4" filter="url(#lampShadow)"/>
    <path d="M221 391 L213 300" stroke="#0b0c0e" stroke-width="21" stroke-linecap="round" opacity=".8"/>
    <path d="M221 391 L213 300" stroke="url(#lampMetal)" stroke-width="13" stroke-linecap="round"/>
    <path d="M213 300 L145 190" stroke="#0b0c0e" stroke-width="19" stroke-linecap="round" opacity=".78"/>
    <path d="M213 300 L145 190" stroke="url(#lampMetal)" stroke-width="12" stroke-linecap="round"/>
    <g id="lampHead" transform="rotate(-18 145 190)" tabindex="0" role="slider" aria-label="Lamba başlık yönü" aria-valuemin="-48" aria-valuemax="48" aria-valuenow="-18" aria-valuetext="Eksi 18 derece" aria-keyshortcuts="ArrowLeft ArrowRight Home">
      <path d="M90 112 Q145 87 200 112 L185 166 Q145 187 105 166 Z" fill="url(#lampShade)" stroke="#c9c5bb" stroke-width="2"/>
      <path d="M98 115 Q145 96 192 115" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".4"/>
      <ellipse cx="145" cy="166" rx="40" ry="7" fill="#141618" stroke="#c9c5bb" stroke-width="2"/>
      <ellipse cx="145" cy="167" rx="27" ry="4" fill="#ffda7d" opacity=".92"/>
      <ellipse cx="145" cy="169" rx="24" ry="24" fill="url(#lampBulb)" opacity=".9" filter="url(#lampGlow)"/>
      <path d="M145 166 L145 190" stroke="url(#lampMetal)" stroke-width="9" stroke-linecap="round"/>
      <path d="M89 111 Q145 84 201 111 L186 169 Q145 190 104 169 Z" fill="transparent" stroke="transparent" stroke-width="18"/>
    </g>
    <circle cx="145" cy="190" r="16" fill="#17191b" stroke="url(#lampMetal)" stroke-width="5"/><circle cx="145" cy="190" r="5" fill="#d7d2c8"/>
    <circle cx="213" cy="300" r="16" fill="#17191b" stroke="url(#lampMetal)" stroke-width="5"/><circle cx="213" cy="300" r="5" fill="#d7d2c8"/>
    <path d="M179 391 Q214 377 248 391 L276 404 Q280 413 264 418 L166 418 Q149 413 154 404 Z" fill="#141618" stroke="url(#lampMetal)" stroke-width="2"/>
  </svg>
</aside>
